# Старый адрес отключён. Перенаправления и старый сертификат не используются.
# Явное правило нужно, чтобы wildcard DNS и default server не открывали сайт.
server {
    listen 80;
    server_name tko.megaev.ru;
    return 410;
}

server {
    listen 443 ssl;
    server_name tko.megaev.ru;
    ssl_reject_handshake on;
}
