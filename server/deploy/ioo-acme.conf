# Временная конфигурация для выпуска сертификата нового домена.
# Удалить после включения окончательных HTTP/HTTPS-конфигураций ioo.megaev.ru.
server {
    listen 80;
    server_name ioo.megaev.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 404;
    }
}
