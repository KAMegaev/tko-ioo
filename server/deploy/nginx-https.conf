# Включать после выпуска сертификата и проверки nginx -t.
server {
    listen 443 ssl;
    server_name ioo.megaev.ru;

    ssl_certificate /etc/letsencrypt/live/ioo.megaev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ioo.megaev.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 24m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 310s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
